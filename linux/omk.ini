; omk.ini - the settings of this build. Every feature is turned ON, except the
; few that cost a lot or duplicate another one (they are written as ; lines).
;
; Too slow? Turn things off by putting a ; at the start of the line.
; The heaviest ones are raytracing, rtreflections, supersampling, framegen and
; (in a crowded street) smooth. omk.ini.example lists every setting with an
; explanation.
;
; If you unzip a newer build over this one, this file is replaced:
; keep a copy of yours.

[Preferences]
; 0 = fullscreen (F11 toggles), 1 = in a window
window = 0
; The Linux build draws with Vulkan.
renderer = vulkan

[Options]
; The game's own "level of detail" option. At 2 the weather (rain, snow) runs.
; A game you saved keeps ITS value (Options > level of detail, the 7th row): if you
; never see the rain, set it to 2 there.
levelofdetail = 2

[Enhancements]
; Everything of the fork at its maximum: 32 bit colours, ray tracing and ray
; traced reflections, bloom, depth of field, soft particles, volumetric lights,
; frame generation, smoother animations, better LOD, vehicle shine, SSAO,
; anti-aliasing, texture filtering, shadows...
all = max
; "all = max" also lifts the draw distance cap and with it the city's fog. That costs
; about a fifth of the frame in a crowded street and adds nothing you can see at
; 200 m, so the game's cap is kept. Remove this line for an unlimited distance.
clipdistance = capped
; These are not in "all", they are turned on here:
supersampling = 2
colorgrade = cyber        ; off, cyber, warm, noir or filmic
hdr = on                  ; HDR output, used only when the display and the desktop offer it
; The upscaler: AMD FSR 3.1 (libamd_fidelityfx_vk.so, keep it next to omk-play).
; DLSS is not in the Linux build.
upscaler = fsr
; native, quality, balanced, performance or ultraperformance
upscalequality = native
; THE HD TEXTURES: your pack, a folder of <group>/<model>/<MATERIAL>.png made by
; tools/texpack.py (the README says how). A folder that is not there is ignored.
texturepack = remaster/pack

[Remaster]
; The weather, the wet streets and the mist of sosso33's remaster.
; Rain is the game's own: in Anekbah it starts about 8 minutes after you arrive, and
; Qalisar and Lahoreh have their showers. The wet streets, ripples, puddles and
; reflections only show while it rains.
water = 0.6
floors = 1
wet = 1
rain3d = 1
mist = 0.5
; Rounded characters: off here, it costs 4 to 5 ms in a crowded street (a 45 fps street
; instead of 57). Remove the ; to turn it on.
;smooth = 0.75
preload = 15
; Not written here on purpose:
;  bloom, ao, upscale: this fork has its own (bloom, ssao and upscaler above)
; THE OTHER HD PACKS. Put them in a "remaster" folder next to omk-play, they are
; picked up by themselves (a folder that is not there is ignored).
uipack = remaster/ui/pack
fontpack = remaster/fonts/pack
filmpack = remaster/films/pack
grade = remaster/grades

[OMK]
; Fullscreen at your desktop's resolution.
desktopresolution = on
; The language of the options added by this fork follows the game's language
; (French or English). To force it:  language = en  or  language = fr

[Restored]
; The showers of Qalisar and Lahoreh and the sandstorms the game never shipped.
weather = 1
