# Builds the game for Windows (zip, FSR and DLSS included) and for Linux
# (tar.gz, Vulkan) on every push to the `fixes` branch, and puts both on one
# release. A commit message with [linux-only] builds just the Linux package
# (no release): handy while working on it.
name: Build

on:
  push:
    branches: [fixes]
    # a push that only touches documentation does not build; one that also touches
    # code (or omk.ini, the tables, this workflow...) does
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'book/**'
      - 'tutorial/**'
      - 'transcript/**'
      - 'manual/**'
      - 'todo/**'
      - 'LICENSE'
      - 'LICENSING.md'
  workflow_dispatch:   # or start it by hand from the Actions tab

permissions:
  contents: write   # to create the release

concurrency:
  group: build
  cancel-in-progress: true

env:
  VULKAN_VERSION: 1.4.363.0
  FSR_VERSION: v2.3.0
  STREAMLINE_VERSION: v2.14.16
  W64DEVKIT_VERSION: 2.10.1
  SDL2_VERSION: 2.32.10

jobs:
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[linux-only]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The compiler is w64devkit (gcc, make, pkg-config in one folder) and SDL2 is
      # its MinGW package. MSYS2's Windows headers are too old for NVIDIA's DLSS header.
      - name: Compiler (w64devkit) and SDL2
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/skeeto/w64devkit/releases/download/v$env:W64DEVKIT_VERSION/w64devkit-x64-$env:W64DEVKIT_VERSION.7z.exe" -OutFile w64devkit.7z.exe
          Start-Process .\w64devkit.7z.exe -Wait -ArgumentList "-y", "-oC:\"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-mingw.tar.gz" -OutFile sdl2.tar.gz
          New-Item -ItemType Directory -Force deps\sdl2 | Out-Null
          tar -xzf sdl2.tar.gz -C deps\sdl2
          Get-ChildItem C:/w64devkit/bin/g++.exe, C:/w64devkit/bin/make.exe, C:/w64devkit/bin/pkg-config.exe, "deps/sdl2/SDL2-$env:SDL2_VERSION/x86_64-w64-mingw32/bin/SDL2.dll"

      # The Vulkan SDK gives the headers, vulkan-1.lib and the shader tools
      # (glslc, spirv-cross, dxc). It is big, so it is cached.
      - name: Vulkan SDK cache
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_VERSION }}

      - name: Vulkan SDK install
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Invoke-WebRequest $url -OutFile vulkan-sdk.exe
          Start-Process .\vulkan-sdk.exe -Wait -ArgumentList "--accept-licenses --default-answer --confirm-command install"
          Get-ChildItem C:/w64devkit/bin/g++.exe, C:/w64devkit/bin/make.exe, C:/w64devkit/bin/pkg-config.exe, "deps/sdl2/SDL2-$env:SDL2_VERSION/x86_64-w64-mingw32/bin/SDL2.dll"

      # The upscalers: AMD's FidelityFX SDK (FSR, MIT licence, signed DLLs) and
      # NVIDIA's Streamline SDK (DLSS). Both come from their public GitHub repos;
      # only the parts the build needs are taken.
      - name: Upscaler SDKs cache
        id: upscaler-cache
        uses: actions/cache@v4
        with:
          path: upscalers
          key: upscalers-fsr-${{ env.FSR_VERSION }}-sl-${{ env.STREAMLINE_VERSION }}

      - name: Upscaler SDKs download
        if: steps.upscaler-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p upscalers
          git clone -q --depth 1 --branch "$FSR_VERSION" --filter=blob:none --sparse \
            https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git upscalers/fsr-clone
          git -C upscalers/fsr-clone sparse-checkout set --no-cone \
            "Kits/FidelityFX/api/" "Kits/FidelityFX/signedbin/" \
            "Kits/FidelityFX/upscalers/include/" "Kits/FidelityFX/docs/license.md"
          mv upscalers/fsr-clone/Kits/FidelityFX upscalers/fsr
          rm -rf upscalers/fsr-clone
          mkdir -p upscalers/streamline
          curl -sSL -o streamline.zip \
            "https://github.com/NVIDIAGameWorks/Streamline/releases/download/$STREAMLINE_VERSION/streamline-sdk-$STREAMLINE_VERSION.zip"
          # Windows' own tar reads zips (Git's does not)
          /c/Windows/System32/tar.exe -xf streamline.zip -C upscalers/streamline include bin/x64 license.txt 3rd-party-licenses.md
          rm -rf upscalers/streamline/bin/x64/development streamline.zip

      - name: Build
        shell: bash
        run: |
          export PATH="/c/w64devkit/bin:$PATH"
          export VULKAN_SDK="C:/VulkanSDK/$VULKAN_VERSION"
          export SDL2_DIR="$(pwd -W)/deps/sdl2/SDL2-$SDL2_VERSION/x86_64-w64-mingw32"
          export FSR_SDK="$(pwd -W)/upscalers/fsr"
          export SL_SDK="$(pwd -W)/upscalers/streamline"
          bash ./build-windows.sh -j"$(nproc)"

      - name: Pack the zip
        shell: bash
        run: |
          mkdir -p dist/licenses
          # the exe (the compiler's runtime is linked in), SDL2, and the upscalers' DLLs (the build copies them next to the exe)
          cp engine/build/omk-play.exe dist/
          cp engine/build/*.dll dist/
          # the build must have both upscalers, or the release would be missing a feature
          for f in amd_fidelityfx_loader_dx12.dll amd_fidelityfx_upscaler_dx12.dll sl.interposer.dll sl.common.dll sl.dlss.dll nvngx_dlss.dll; do
            [ -f "dist/$f" ] || { echo "MISSING $f - FSR / DLSS did not get built in"; exit 1; }
          done
          cp -r tables dist/tables
          cp windows/omk.ini omk.ini.example dist/
          cp LICENSE dist/licenses/OMK-LICENSE.txt
          cp upscalers/fsr/docs/license.md dist/licenses/AMD-FidelityFX-license.md
          cp upscalers/streamline/license.txt dist/licenses/NVIDIA-Streamline-license.txt
          cp upscalers/streamline/3rd-party-licenses.md dist/licenses/NVIDIA-Streamline-3rd-party.md
          cp upscalers/streamline/bin/x64/nvngx_dlss.license.txt dist/licenses/NVIDIA-DLSS-license.txt
          cat > dist/README.txt <<'EOT'
          Omikron - OMK engine, Windows build (Direct3D 12 / Vulkan, FSR and DLSS).

          1. You need your own copy of the game (the Steam one is fine).
          2. Unzip ALL of this INTO the game's folder (the one with Runtime.exe).
          3. Double-click omk-play.exe. Every feature is on by default.
          4. To turn features off, edit omk.ini with Notepad (omk.ini.example explains
             every setting).

          The game's own files are never changed. To remove everything, delete the files
          you unzipped (and the omk-saves folder if you want to forget the saves).

          More: https://github.com/orionaskatu/omikron-tns-omk-engine
          EOT

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath omk-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: omk-windows
          path: omk-windows.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SDL2 and the Vulkan headers to build against, glslc to compile the shaders
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config libsdl2-dev libvulkan-dev glslc

      - name: Build
        working-directory: engine
        run: make play -j"$(nproc)"

      - name: Pack the archive
        run: |
          ldd engine/build/omk-play
          mkdir -p dist/licenses
          cp engine/build/omk-play dist/
          cp -r tables dist/tables
          cp linux/omk.ini omk.ini.example dist/
          cp LICENSE dist/licenses/OMK-LICENSE.txt
          cat > dist/README.txt <<'EOT'
          Omikron - OMK engine, Linux build (Vulkan).

          1. You need your own copy of the game (the Steam one is fine).
          2. Put ALL of this INTO the game's folder (the one with the IAM folder),
             or extract it anywhere and, from that folder, run: ./omk-play /path/to/Omikron
             With no path it also looks in Steam's usual folders.
          3. Run ./omk-play. Every feature is on by default.
          4. To turn features off, edit omk.ini (omk.ini.example explains every setting).

          You need a Vulkan driver and the SDL2 library (libsdl2-2.0-0 on Debian and
          Ubuntu, sdl2 on Arch and Fedora). Ray tracing needs a GPU with ray queries.
          Built on Ubuntu 24.04: it needs a glibc of that age or newer.

          The game's own files are never changed. Saves go to the omk-saves folder
          next to omk-play.

          More: https://github.com/orionaskatu/omikron-tns-omk-engine
          EOT
          tar -czf omk-linux.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: omk-linux
          path: omk-linux.tar.gz
          if-no-files-found: error

  # One release with whatever was built: Windows has to have worked, Linux is
  # added when it did.
  release:
    needs: [windows, linux]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          tag="build-${GITHUB_RUN_NUMBER}"
          files="pkg/omk-windows.zip"
          linux="no Linux package (that build failed)"
          if [ -f pkg/omk-linux.tar.gz ]; then files="$files pkg/omk-linux.tar.gz"; linux="omk-linux.tar.gz (Vulkan)"; fi
          {
            echo "Build of commit $short (branch $GITHUB_REF_NAME)."
            echo
            echo "- omk-windows.zip: Direct3D 12 / Vulkan, with FSR and DLSS. Unzip it INTO your game folder (the one with Runtime.exe), then double-click omk-play.exe."
            echo "- $linux: put it INTO your game folder, then run ./omk-play."
            echo
            echo "Last commit:"
            echo
            git log -1 --format=%B
          } > notes.txt
          gh release create "$tag" $files --target "$GITHUB_SHA" --title "Build #${GITHUB_RUN_NUMBER} ($short)" --notes-file notes.txt --latest
