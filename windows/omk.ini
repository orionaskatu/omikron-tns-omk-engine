; omk.ini - the settings of this build. Every feature is turned ON.
;
; Too slow? Turn things off by putting a ; at the start of the line.
; The heaviest ones are raytracing, rtreflections, framegen and the upscaler.
; omk.ini.example lists every setting with an explanation.
;
; If you unzip a newer build over this one, this file is replaced:
; keep a copy of yours.

[Preferences]
; Direct3D 12 (needed for FSR / DLSS). Write vulkan to use Vulkan instead.
; You can also switch while playing with the V key.
renderer = d3d12

[Options]
; The game's own "level of detail" option. At 2 the weather (rain, snow) runs.
levelofdetail = 2

[Enhancements]
; Everything of the fork at its maximum: 32 bit colours, ray tracing and ray
; traced reflections, bloom, depth of field, soft particles, volumetric lights,
; frame generation, smoother animations, better LOD, vehicle shine, SSAO,
; anti-aliasing, texture filtering, shadows...
all = max
; The upscaler: dlss on an NVIDIA card (it falls back to fsr on any other card).
upscaler = dlss
; native, quality, balanced, performance or ultraperformance
upscalequality = quality
; Not turned on by "all", because they are a matter of taste or of your screen:
; colorgrade = cyber        (off, cyber, warm, noir or filmic)
; hdr = on                  (only if Windows HDR is on)

[Remaster]
; The weather, the wet streets, the mist and the lights of sosso33's remaster.
; (The HD texture pack is not in the build, see the README.)
water = 0.6
floors = 1
wet = 1
rain3d = 1
mist = 0.5
relief = 2
ao = 2
bodylight = 1
fxlight = 1
smooth = 0.75
preload = 15

[Restored]
; The showers of Qalisar and Lahoreh and the sandstorms the game never shipped.
weather = 1
