; omk.ini - the settings of this build. Every feature is turned ON.
;
; Too slow? Turn things off by putting a ; at the start of the line.
; The heaviest ones are raytracing, rtreflections, supersampling, framegen and
; the upscaler. omk.ini.example lists every setting with an explanation.
;
; If you unzip a newer build over this one, this file is replaced:
; keep a copy of yours.

[Preferences]
; 0 = fullscreen (F11 toggles), 1 = in a window
window = 0
; Direct3D 12 gives FSR 4 (on an AMD RDNA 4 card) and DLSS. Write vulkan to use Vulkan
; instead: the upscaler then runs FSR 3.1 (or DLSS on an NVIDIA card), and the remaster's
; water, wet floors, relief and ambient occlusion are drawn, which Direct3D 12 does not do.
; You can also switch while playing with the V key.
renderer = d3d12

[Options]
; The game's own "level of detail" option. At 2 the weather (rain, snow) runs.
levelofdetail = 2

[Enhancements]
; Everything of the fork at its maximum: 32 bit colours, ray tracing and ray
; traced reflections, bloom, depth of field, soft particles, volumetric lights,
; frame generation, smoother animations, better LOD, vehicle shine, SSAO,
; anti-aliasing, texture filtering, shadows...
all = max
; These four are not in "all", they are turned on here:
supersampling = 2
colorgrade = cyber        ; off, cyber, warm, noir or filmic
hdr = on                  ; HDR output, used only when Windows HDR is on
; The upscaler: dlss on an NVIDIA card (it falls back to fsr on any other card), with
; either renderer. Direct3D 12 uses FSR 4 on an RDNA 4 card, Vulkan always FSR 3.1.
upscaler = dlss
; native, quality, balanced, performance or ultraperformance
upscalequality = native

[Remaster]
; The weather, the wet streets, the mist and the lights of sosso33's remaster.
water = 0.6
floors = 1
wet = 1
rain3d = 1
mist = 0.5
relief = 2
ao = 2
bodylight = 1
fxlight = 1
smooth = 0.75
preload = 15
; THE HD PACKS. Put your packs in a "remaster" folder next to omk-play.exe,
; they are picked up by themselves (a folder that is not there is ignored).
; The README says how to make them.
texturepack = remaster/pack
uipack = remaster/ui/pack
fontpack = remaster/fonts/pack
filmpack = remaster/films/pack
grade = remaster/grades

[OMK]
; Fullscreen at your desktop's resolution.
desktopresolution = on
; The language of the options added by this fork follows the game's language
; (French or English). To force it:  language = en  or  language = fr

[Restored]
; The showers of Qalisar and Lahoreh and the sandstorms the game never shipped.
weather = 1
